{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">
        IMAP Monitor
    </h1>
    {{template "flashes" .Flashes}}
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div id="stats_div" style="display:none;">
        <div class="alert alert-info">
            <i class="fa fa-info-circle"></i> You have received <strong><span id="report_count"></span></strong> non-campaign related emails. 
            Last email received at <strong><span id="last_reported"></span></strong>.
        </div>
    </div>
    <div id="filter_div" style="display:none; margin-bottom: 20px;">
        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="imap_filter">Filter by IMAP Configuration:</label>
                    <select id="imap_filter" class="form-control">
                        <option value="0">All Configurations</option>
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div id="no_reports_message" style="display:none;">
        <div class="alert alert-info">
            <i class="fa fa-info-circle"></i> No non-campaign related emails have been received yet.
        </div>
    </div>
    <div id="non_campaign_table_div" style="display:none;">
        <table id="non_campaign_table" class="table table-striped table-bordered" style="width:100%">
            <thead>
                <tr>
                    <th class="no-sort" style="width: 30px;"></th>
                    <th>Reporter</th>
                    <th>Subject</th>
                    <th>Reported At</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/dist/app/non_campaign_reports.min.js"></script>
{{end}}
