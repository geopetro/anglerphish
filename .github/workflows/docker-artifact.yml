name: Docker build and publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Anuluj starsze buildy PR, ale nie przerywaj publikacji.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    name: Build Docker artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: anglerphish:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Klasyczne archiwum Docker do późniejszego docker load.
          provenance: false
          sbom: false
          outputs: type=docker,dest=${{ runner.temp }}/anglerphish.tar
          cache-from: type=gha,scope=anglerphish-amd64
          cache-to: type=gha,mode=max,scope=anglerphish-amd64

      - name: Compress image and generate checksum
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gzip -1 anglerphish.tar
          sha256sum anglerphish.tar.gz > anglerphish.tar.gz.sha256

      - name: Upload image artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: anglerphish-linux-amd64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/anglerphish.tar.gz
            ${{ runner.temp }}/anglerphish.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish image to GHCR
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v'))

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/image
          merge-multiple: true

      - name: Verify and load image
        working-directory: ${{ runner.temp }}/image
        env:
          SOURCE_IMAGE: anglerphish:${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum -c anglerphish.tar.gz.sha256
          gunzip -c anglerphish.tar.gz | docker load
          docker image inspect "$SOURCE_IMAGE" > /dev/null

      - name: Determine GHCR image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the built image
        env:
          SOURCE_IMAGE: anglerphish:${{ github.sha }}
          TARGET_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          test -n "$TARGET_TAGS"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$SOURCE_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TARGET_TAGS"

      - name: Write publication summary
        env:
          TARGET_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published Docker images"
            echo
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              printf -- '- `%s`\n' "$tag"
            done <<< "$TARGET_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
